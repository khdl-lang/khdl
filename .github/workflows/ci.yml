name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.96.0

jobs:
  rust-fmt:
    name: Rust format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: cargo fmt
        run: cd rust && cargo fmt --all -- --check

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        run: cd rust && cargo clippy --all-features

  rust-build-test:
    name: Rust build and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        run: cd rust && cargo test --all-features

  python-build-test:
    name: Python build and test
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Fork that installs verilator into the tool cache, which has a stable path across runs (needed for ccache hits).
      # TODO switch back to veryl-lang/setup-verilator@v1 once https://github.com/veryl-lang/setup-verilator/pull/1 is merged.
      - name: Install verilator
        uses: KarelPeeters/setup-verilator@220929904b0d56dc210d44624b9cff5f2c145800
        with:
          version: "5.040"

      - name: Install ccache
        run: sudo apt-get install -y --no-install-recommends ccache
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-verilator-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-verilator-${{ runner.os }}-

      - name: Sync dependencies
        run: (cd python && uv sync)

      - name: Run pytest
        run: (cd python && uv run pytest -n auto)
      - name: ccache statistics
        run: ccache -s

  webdemo-build:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
      - name: Install wasm-pack
        run: npm install -g wasm-pack
      - name: Run wasm-pack
        run: cd rust/khdl_wasm && wasm-pack build --target web
      - name: NPM install
        run: cd web_demo && npm ci
      - name: NPM build
        run: cd web_demo && npm run build
      # The landing page is at the root of the site, the web demo at /demo/.
      - name: Build landing page
        run: node website/build.mjs --out site && cp -r web_demo/dist site/demo
      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: site
          if-no-files-found: error

  webdemo-deploy:
    name: Website deploy
    runs-on: ubuntu-latest
    needs: [ webdemo-build, rust-build-test, python-build-test ]
    # Only deploy for actual pushes to main, not when called from the release workflow.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: page
          path: .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
