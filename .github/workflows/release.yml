# Build python wheels for all supported platforms and publish them to PyPI.
#
# * Pushing a tag `v*` (matching the version in `rust/Cargo.toml`) builds, tests and publishes to PyPI.
# * Running the workflow manually builds and tests, and optionally publishes to TestPyPI.
#   Do this before tagging a release to catch build failures early.
#
# Publishing uses PyPI trusted publishing, no API tokens are stored. This requires a (pending) publisher to be configured
# on PyPI and TestPyPI for this repository, with workflow `release.yml` and environment `pypi` and `testpypi` respectively.

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to TestPyPI"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.96.0

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match crate version $version"
            exit 1
          fi
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: rust/khdl_python
      - uses: actions/upload-artifact@v5
        with:
          name: dist-sdist
          path: rust/khdl_python/dist
          if-no-files-found: error

  wheels:
    name: Build wheels (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Rust requires at least glibc 2.17, which matches manylinux2014.
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: manylinux2014 }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: manylinux2014 }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64 }
          - { name: macos-aarch64, runner: macos-latest, target: aarch64 }
          - { name: windows-x86_64, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The manylinux containers come with all python versions, other platforms need them to be installed.
      # The last version listed becomes the default `python`, which is used for the abi3 build.
      - uses: actions/setup-python@v6
        if: ${{ !matrix.platform.manylinux }}
        with:
          python-version: |
            3.10
            3.11
            3.12
      # A single wheel for python 3.12 and all later versions.
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          rust-toolchain: ${{ env.RUST_VERSION }}
          args: --release --out dist --features abi3
          working-directory: rust/khdl_python
          sccache: true
      # Older python versions don't support everything we need in the stable ABI, so they need version-specific wheels.
      - name: Build version-specific wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          rust-toolchain: ${{ env.RUST_VERSION }}
          args: --release --out dist --interpreter python3.10 python3.11
          working-directory: rust/khdl_python
          sccache: true
      - uses: actions/upload-artifact@v5
        with:
          name: dist-wheels-${{ matrix.platform.name }}
          path: rust/khdl_python/dist
          if-no-files-found: error

  # Smoke test the wheels on a clean machine, without a rust toolchain or the repository sources.
  test-wheels:
    name: Test wheels (${{ matrix.os }}, python ${{ matrix.python }})
    needs: [ wheels ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest ]
        python: [ "3.10", "3.11", "3.12", "3.14" ]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v6
        with:
          pattern: dist-wheels-*
          path: dist
          merge-multiple: true
      - name: Install wheel
        run: python -m pip install --no-index --find-links dist khdl
      - name: Import
        run: python -c "import khdl; print(khdl.Source)"

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ ci, sdist, wheels, test-wheels ]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/khdl
    permissions:
      # required for trusted publishing and attestations
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    needs: [ ci, sdist, wheels, test-wheels ]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/khdl
    permissions:
      # required for trusted publishing and attestations
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
