[package]
name = "khdl_python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "khdl_python"
crate-type = ["cdylib"]

[features]
# Build against the stable python ABI, so a single wheel works for python 3.12 and all later versions.
# Earlier versions don't support subclassing exceptions in the stable ABI, so they still need version-specific builds.
abi3 = ["pyo3/abi3-py312"]

[dependencies]
khdl_language = { workspace = true, features = ["wrap_verilator"] }
khdl_util = { workspace = true }

indexmap.workspace = true
itertools.workspace = true
num-bigint.workspace = true
pyo3.workspace = true
rand.workspace = true
