[project]
name = "khdl"
dynamic = ["version"]
description = "Python bindings for KHDL, an experimental new language for hardware design."
readme = "README.md"
license = "MIT"
license-files = ["LICENCE.txt"]
authors = [{ name = "Karel Peeters" }]
requires-python = ">=3.10"
keywords = ["hardware", "hdl", "fpga", "verilog", "compiler"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://khdl-lang.org/"
Repository = "https://github.com/khdl-lang/khdl"
Issues = "https://github.com/khdl-lang/khdl/issues"

[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "khdl"
features = ["pyo3/extension-module"]

[tool.uv]
cache-keys = [
    { file = "../**/*.toml" },
    { file = "../**/*.rs" },
    { file = "../**/*.kh" },
    { file = "../**/*.lalrpop" },
    { file = "../**/*.pyi" },
    { file = "../khdl_language/src/back/verilog_keywords.txt" },
    { file = "../khdl_language/src/back/verilator_template.cpp" },
]
