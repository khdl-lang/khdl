<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>KHDL demo</title>
    <link rel="icon" href="data:,">
    <style>
        /* Same colors as the landing page, light/dark follows the user's preference. */
        :root {
            color-scheme: light dark;
            --bg: #f7f7f8;
            --panel: #ffffff;
            --panel-2: #f0f1f3;
            --border: #dcdfe4;
            --fg: #383a42;
            --fg-strong: #16181d;
            --muted: #686d78;
            --accent: #2b62d1;
            --accent-fg: #ffffff;
            --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #21252b;
                --panel: #282c34;
                --panel-2: #2f343d;
                --border: #3b414c;
                --fg: #abb2bf;
                --fg-strong: #e6e9ef;
                --muted: #8b919c;
                --accent: #61afef;
                --accent-fg: #1b1e23;
            }

            .icon-mono {
                filter: invert(1);
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font-sans);
            font-size: 15px;
        }

        button {
            font: inherit;
            color: inherit;
        }

        .site-header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: none;
            height: 52px;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
        }

        .wordmark {
            font-weight: 700;
            font-size: 19px;
            letter-spacing: 0.04em;
            color: var(--fg-strong);
            text-decoration: none;
        }

        .header-title {
            color: var(--muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 32px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--panel);
            color: var(--fg-strong);
            font-size: 14px;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
        }

        .button:hover {
            border-color: var(--accent);
        }

        .button img {
            width: 15px;
            height: 15px;
        }

        .panes {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            flex: 1;
            min-height: 0;
        }

        .pane {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            background: var(--panel);
        }

        .pane + .pane {
            border-left: 1px solid var(--border);
        }

        .pane-bar {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            flex: none;
            min-height: 40px;
            padding: 0 8px;
            /* a shadow instead of a border, so the active tab can cover it without sticking out of the bar */
            box-shadow: inset 0 -1px 0 var(--border);
            background: var(--bg);
        }

        .tabs {
            display: flex;
            gap: 2px;
            min-width: 0;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
        }

        .tab {
            display: flex;
            align-items: center;
            flex: none;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 7px 7px 0 0;
            color: var(--muted);
        }

        .tab:hover {
            color: var(--fg-strong);
        }

        .tab.active {
            border-color: var(--border);
            background: var(--panel);
            color: var(--fg-strong);
        }

        .tab-select, .tab-close, .bar-button {
            border: none;
            background: none;
            cursor: pointer;
        }

        .tab-select {
            padding: 9px 4px 9px 12px;
            font-family: var(--font-mono);
            font-size: 13px;
        }

        .tab-close {
            width: 24px;
            height: 24px;
            margin-right: 4px;
            border-radius: 4px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1;
        }

        .tab-close:hover, .bar-button:hover {
            background: var(--panel-2);
            color: var(--fg-strong);
        }

        .bar-button {
            flex: none;
            height: 30px;
            margin-bottom: 5px;
            padding: 0 10px;
            border-radius: 6px;
            color: var(--muted);
            font-size: 14px;
        }

        .bar-button-new {
            font-size: 18px;
            padding: 0 8px;
        }

        .bar-spacer {
            flex: 1;
        }

        .output-tab.active {
            color: var(--fg-strong);
            background: var(--panel-2);
        }

        .editor {
            flex: 1;
            min-height: 0;
        }

        .editor .cm-editor {
            height: 100%;
        }

        .diags {
            flex: none;
            max-height: 40%;
            overflow: auto;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 13px;
            white-space: nowrap;
        }

        .diags:empty {
            display: none !important;
        }

        /* On narrow screens, stack the panes and let the page scroll. */
        @media (max-width: 800px) {
            html, body {
                height: auto;
            }

            .panes {
                grid-template-columns: minmax(0, 1fr);
            }

            .pane + .pane {
                border-left: none;
                border-top: 1px solid var(--border);
            }

            .pane-input .editor {
                height: 60vh;
                flex: none;
            }

            .pane-output .editor {
                height: 70vh;
                flex: none;
            }

            .header-title, .button-label-optional {
                display: none;
            }
        }
    </style>
</head>
<body>

<header class="site-header">
    <a class="wordmark" href="../">KHDL</a>
    <span class="header-title">Demo</span>
    <div class="header-actions">
        <a class="button" href="." id="button-share" title="Copy a link to the code in this tab">
            <img alt="" class="icon-mono" src="res/share.svg">
            <span id="share-label">Share</span>
        </a>
        <a class="button" href="https://github.com/khdl-lang/khdl">
            <img alt="" class="icon-mono" src="res/github-mark.svg">
            <span class="button-label-optional">GitHub</span>
        </a>
    </div>
</header>

<main class="panes">
    <section class="pane pane-input" aria-label="KHDL source">
        <div class="pane-bar">
            <div class="tabs" id="div-tabs"></div>
            <button class="bar-button bar-button-new" id="button-new-tab" title="New tab" aria-label="New tab">+</button>
            <span class="bar-spacer"></span>
            <button class="bar-button" id="button-format" title="Format code (Ctrl+Shift+I)">Format</button>
        </div>
        <div class="editor" id="div-editor-input"></div>
    </section>
    <section class="pane pane-output" aria-label="Compiler output">
        <div class="pane-bar">
            <button class="bar-button output-tab active" data-output="verilog">Verilog</button>
            <button class="bar-button output-tab" data-output="format" title="Formatter debug output">Format debug</button>
            <button class="bar-button output-tab" data-output="ir" title="Intermediate representation">IR</button>
        </div>
        <div class="diags" id="div-diags-compile"></div>
        <div class="diags" id="div-diags-format" style="display: none"></div>
        <div class="editor" id="div-editor-output-verilog"></div>
        <div class="editor" id="div-editor-output-format" style="display: none"></div>
        <div class="editor" id="div-editor-output-ir" style="display: none"></div>
    </section>
</main>

<noscript>This page contains webassembly and javascript content, please enable javascript in your browser.</noscript>
<script src="./bootstrap.js"></script>
</body>
</html>
